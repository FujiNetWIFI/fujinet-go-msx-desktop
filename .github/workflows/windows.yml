name: Windows

# Third of the M7 CI jobs (see TODO). Native MSYS2/UCRT64, matching how
# tools/fujinet/build-fujinet-desktop.sh and tools/openmsx/build-openmsx-
# desktop.sh already expect to be run (their cygpath/bash-by-name handling
# is written for an MSYS2 shell). cmake/toolchains/mingw-w64.cmake exists
# for cross-compiling the session/frontend code from Linux when no Windows
# box is available for that; this workflow is the real thing once it runs
# on a windows-latest runner.
#
# Iterated extensively against real windows-latest CI runs (no Windows
# machine in this development environment, so every fix along the way --
# tools/openmsx/patches/patch-staged-tree.py's later patches,
# tools/openmsx/build-openmsx-desktop.sh's ar/PKG_CONFIG_PATH handling,
# cmake/OpenMSXRuntime.cmake's Windows system-library block,
# core/src/paths.c's config/data-dir fallback -- was root-caused from a
# real CI failure, never guessed blind). OPENMSX_TARGET_OS=mingw-w64
# triggers the same NEED_3RDPARTY static-build chain as darwin
# (cmake/OpenMSXRuntime.cmake, tools/openmsx/build-openmsx-desktop.sh).
#
# The Mesa step below addresses the last gap found this way: openMSX's
# renderer needs a real OpenGL 2.1+ context, but windows-latest runners
# have no GPU and Windows' own software fallback (the ancient Microsoft
# GDI Generic implementation) is OpenGL 1.1 only -- confirmed directly
# from a real CI run ("renderer init failed: Need at least OpenGL version
# openGL 2.1"). f3d-app/install-mesa-windows-action drops a real,
# llvmpipe-backed opengl32.dll (from pal1000/mesa-dist-win, the standard
# source for this exact well-known GitHub Actions Windows + OpenGL gap)
# next to the ctest binaries -- Windows' own DLL search order checks an
# executable's own directory before System32, so this shadows the
# system's inadequate one without touching anything system-wide.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          # autocrlf would rewrite every staged/patched openMSX/FujiNet
          # source file's line endings on checkout, which is exactly the
          # kind of diff-shaped noise cmake/StageOpenMSX.cmake's re-stage
          # detection (content hashing of the patch scripts) is not
          # expecting.
          fetch-depth: 1

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            autoconf
            automake
            libtool
            nasm
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Install Mesa (software OpenGL for the ctest binaries)
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          path: ${{ github.workspace }}/build/core

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
