name: Release

# Cutting a release, entirely on the org's self-hosted runners (Linux jobs in
# containers on TMA-3, macOS on the Tahoe runner; Windows is cross-built with
# MinGW and tested under Wine). Triggered by a `v*` tag, builds every artifact this
# repository publishes -- Linux packages for both frontends (.deb/.rpm/.tar.gz
# via CPack), both flatpak single-file bundles, a zipped universal
# (arm64 + x86_64) macOS app bundle, and a Windows (x86-64) portable
# zip plus NSIS installer -- and attaches them to a draft GitHub Release.
#
# Run by hand (workflow_dispatch) it is a dry run: every artifact is built,
# tested and uploaded to the run, the version is the tree's own, and no
# release is created -- so the whole pipeline can be proven green without
# pushing a tag.
#
# What is and is not proven, so a red run can be read correctly:
#   linux, flatpak   run locally and in CI; a failure is a regression.
#   windows          built and tested natively on every push (windows.yml);
#                    new here: the static SDL3, the import-table check, NSIS.
#   macos            compiled only on CI (macos.yml), never on the
#                    development machine. A failure here is real signal about
#                    frontends/macos, not necessarily the workflow.
#
# The version is declared in the tree, not derived from the tag, so a
# downloaded build's About box can never disagree with the download it came
# from: the version-check job below fails loudly if the tag,
# CMakeLists.txt's project(... VERSION ...) and both frontends' metainfo
# <release version="..."> entries do not all agree. See "Cutting a release"
# in the README.
#
# Unlike the sibling repos, no separate static-SDL step is needed anywhere
# here: openMSX supplies its own SDL2 (dynamically linked from the system
# package on Linux, statically built from source via its own NEED_3RDPARTY
# chain on macOS/Windows -- see cmake/OpenMSXRuntime.cmake and
# tools/openmsx/build-openmsx-desktop.sh), so the macOS/Windows push-CI jobs
# already produce a self-contained static build with no further work needed
# for a release. No WITH_*_ROMS=OFF flag either, matching linux.yml/
# macos.yml/windows.yml: C-BIOS is bundled unconditionally (see
# COMPLIANCE.md), so this is the one FujiNet Go target whose release builds
# boot real firmware rather than skipping ROM-gated tests.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --add-host=host.docker.internal:host-gateway
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Install base tools
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4
      - name: Tag, CMakeLists.txt and both metainfo files must all agree
        id: v
        run: |
          cmake_version=$(sed -n 's/^project([^)]*VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "CMakeLists.txt version: $cmake_version"
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="${GITHUB_REF#refs/tags/v}"
              echo "tag version: $tag"
              if [ "$tag" != "$cmake_version" ]; then
                echo "::error::tag v$tag does not match CMakeLists.txt's project() VERSION $cmake_version"
                exit 1
              fi
              ;;
            *)
              # a dispatched dry run: the tree's own version, no release at the end
              echo "not a tag ($GITHUB_REF): dry run of $cmake_version"
              tag="$cmake_version"
              ;;
          esac
          for m in frontends/gnome/data/*.metainfo.xml frontends/kde/data/*.metainfo.xml; do
            if ! grep -q "<release version=\"$tag\"" "$m"; then
              echo "::error::$m has no <release version=\"$tag\"> entry"
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  linux-packages:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        frontend: [gnome, kde]
    # ubuntu-26.04, not ubuntu-latest: the frontends need Qt >= 6.7 and
    # GTK >= 4.16 (26.04 has Qt 6.10 and GTK 4.22; 24.04 has 6.4 and 4.14, and
    # CMake would refuse the frontend named below). The .deb/.rpm therefore
    # need a distro at least that new.
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:26.04
      options: --add-host=host.docker.internal:host-gateway
    steps:
      # Same package list as linux.yml, plus dpkg-dev/rpm for CPack's DEB
      # and RPM generators.
      - name: Install build tools and frontend toolkits
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl \
            qt6-webengine-dev \
            build-essential cmake ninja-build python3 pkg-config git \
            tcl-dev libsdl2-dev libsdl2-ttf-dev libpng-dev libogg-dev \
            libvorbis-dev libtheora-dev libglew-dev zlib1g-dev \
            libfreetype-dev libgl-dev libasound2-dev \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
            qt6-base-dev qt6-base-private-dev qt6-shadertools-dev \
            libqt6opengl6-dev \
            desktop-file-utils appstream \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxss-dev \
            libxcursor-dev libxkbcommon-dev libwayland-dev libdrm-dev \
            libgbm-dev libgl1-mesa-dev libpulse-dev libasound2-dev \
            libxtst-dev dpkg-dev rpm python3-venv libssl-dev file

      - uses: actions/checkout@v4

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Statically linked (unlike linux.yml's push-CI job, which links the
      # packaged shared SDL3 for speed), so the shipped .deb/.rpm/.tar.gz
      # have no libSDL3.so runtime dependency -- same reasoning as the
      # release-grade SDL3 build the windows-package/macos-package jobs use.
      - name: Build and install static SDL3 (release-3.4.12, pinned)
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3-src
          cmake -S /tmp/sdl3-src -B /tmp/sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/sdl3-build
          cmake --install /tmp/sdl3-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DFRONTEND=${{ matrix.frontend }}

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Package (deb, rpm, tar.gz)
        working-directory: build
        run: cpack -G "DEB;RPM;TGZ"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.frontend }}
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
          if-no-files-found: error

  flatpaks:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - build-aux/flatpak/online.fujinet.go.msx.gnome.yml
          - build-aux/flatpak/online.fujinet.go.msx.kde.yml
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --privileged --add-host=host.docker.internal:host-gateway
    steps:
      # --privileged: flatpak-builder's bubblewrap sandbox needs user namespaces.
      - name: Install flatpak and flatpak-builder
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl flatpak flatpak-builder elfutils unzip xz-utils
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/checkout@v4

      - name: Install the runtime and SDK this manifest targets
        run: |
          runtime=$(sed -n 's/^runtime: *//p' "${{ matrix.manifest }}")
          runtime_version=$(sed -n "s/^runtime-version: *'\(.*\)'/\1/p" "${{ matrix.manifest }}")
          sdk=$(sed -n 's/^sdk: *//p' "${{ matrix.manifest }}")
          flatpak install -y --user flathub \
            "${runtime}/x86_64/${runtime_version}" \
            "${sdk}/x86_64/${runtime_version}"

      - name: Build and export to a local repo
        run: |
          flatpak-builder --user --force-clean --repo=repo \
            --disable-rofiles-fuse build-flatpak "${{ matrix.manifest }}"

      - name: Bundle into a single installable file
        id: bundle
        run: |
          app_id=$(sed -n 's/^app-id: *//p' "${{ matrix.manifest }}")
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo "${app_id}.flatpak" "${app_id}" master
          echo "app_id=${app_id}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ steps.bundle.outputs.app_id }}
          path: '*.flatpak'
          if-no-files-found: error

  # Cross-built with MinGW-w64 in an ubuntu:24.04 container and tested under
  # Wine (there is no Windows runner); .github/workflows/mingw-deps.sh builds
  # the pinned static dependencies, SDL3 included, so the shipped exe has no
  # loose SDL3.dll dependency.
  windows-package:
    needs: check-version
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --add-host=host.docker.internal:host-gateway
    env:
      WINEPREFIX: /tmp/wine
      WINEDEBUG: -all
    steps:
      - name: Install build tools, MinGW-w64, Wine and NSIS
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates \
            build-essential make python3 python3-pip python3-venv python3-jinja2 \
            python3-yaml cmake ninja-build pkg-config mingw-w64 wine wine64 \
            xz-utils bzip2 perl nsis autoconf automake libtool nasm pkgconf tcl
          # openMSX's makefile uses the plain x86_64-w64-mingw32-gcc/g++ names, which Ubuntu
          # points at the win32-threads variants; the app and libraries use the posix ones
          for tool in gcc g++; do
            update-alternatives --set x86_64-w64-mingw32-$tool /usr/bin/x86_64-w64-mingw32-$tool-posix
          done

      - uses: actions/checkout@v4
        with:
          # See windows.yml's own comment: autocrlf would rewrite every
          # staged/patched openMSX/FujiNet source file's line endings on
          # checkout, which is exactly the kind of diff-shaped noise
          # cmake/StageOpenMSX.cmake's re-stage detection is not expecting.
          fetch-depth: 1

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache MinGW dependencies
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mingw
          key: mingw-deps-${{ hashFiles('.github/workflows/mingw-deps.sh') }}

      - name: Build MinGW dependencies
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        run: .github/workflows/mingw-deps.sh "$RUNNER_TEMP/mingw"

      - name: Configure
        run: |
          P="$RUNNER_TEMP/mingw"
          echo "MBEDTLS_ROOT_DIR=$P" >> "$GITHUB_ENV"
          echo "FUJINET_CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$P/toolchain.cmake -DCMAKE_PREFIX_PATH=$P -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_C_FLAGS=-Wno-error=stringop-truncation -DCMAKE_CXX_FLAGS=-Wno-error=conversion-null" >> "$GITHUB_ENV"
          # openMSX's static SDL2 needs Windows' own libraries too
          LIBS="-L$P/lib -static -lws2_32 -lcrypt32 -lbcrypt -luuid -lole32 -lgdi32 -luser32 -limm32 -lwinmm -lversion -lsetupapi -loleaut32 -lshell32 -ladvapi32"
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$P/toolchain.cmake" \
            -DCMAKE_PREFIX_PATH="$P" \
            -DCMAKE_CROSSCOMPILING_EMULATOR=wine \
            "-DCMAKE_C_STANDARD_LIBRARIES=$LIBS" "-DCMAKE_CXX_STANDARD_LIBRARIES=$LIBS"

      - name: Build
        run: cmake --build build

      # These seven tests start openMSX's renderer through SDL, which needs a video
      # driver and an OpenGL context; there is no display under headless Wine. The
      # other five run.
      - name: Test
        working-directory: build
        run: ctest --output-on-failure -E '^(debugger_test|vdp_test|boot_smoke|fujinet_smoke|machine_switch_test|rpc_test|external_smoke)$'

      # Both binaries in the artifact must depend only on system DLLs; the
      # FujiNet DLL shipping a MinGW or OpenSSL import (libcrypto, zlib1,
      # libwinpthread) would launch fine under Wine but LoadLibrary-fail on a
      # clean Windows box. The import table is what is checked.
      - name: Verify the shipped binaries are self-contained
        run: |
          fail=0
          EXE=build/frontends/windows/fujinet-go-msx-windows.exe
          DLL=tools/fujinet/work/out/fujinet.dll
          for f in "$EXE" "$DLL"; do
            test -f "$f" || { echo "::error::$f not built"; exit 1; }
            echo "--- $f imports ---"
            imports=$(x86_64-w64-mingw32-objdump -p "$f" | sed -n 's/^\s*DLL Name: //p' | sort -u)
            echo "$imports"
            bad=$(echo "$imports" | grep -ivE \
              '^(api-ms-win-[a-z0-9el-]+|kernel32|user32|gdi32|advapi32|shell32|ole32|oleaut32|comctl32|comdlg32|imm32|winmm|version|setupapi|dwmapi|ws2_32|iphlpapi|bcrypt|crypt32|secur32|netapi32|userenv|dbghelp|shlwapi|msvcrt|ucrtbase|rpcrt4|winspool|uxtheme|hid|cfgmgr32|powrprof|avrt|dxgi|d3d11|opengl32|glu32)\.dll$' \
              || true)
            if [ -n "$bad" ]; then
              echo "::error::$f imports non-system DLLs that are not shipped:"
              echo "$bad"
              fail=1
            fi
          done
          exit $fail

      # The portable artifact is the folder you copy and run: the exe,
      # fujinet.dll beside it (where the session looks first), the pristine
      # FujiNet runtime tree it provisions from, and the openMSX runtime
      # share tree (init.tcl, scripts/, machines/ incl. C-BIOS, extensions/
      # incl. FujiNet.xml) the emulator core itself needs to boot at all --
      # the one addition beyond the CoCo/ADAM staging shape, since those
      # cores need no equivalent share tree. The installer packages this
      # same staged folder, so the two downloads are the same bits, packaged
      # twice.
      - name: Stage the app folder
        run: |
          mkdir -p dist/FujiNet-Go-MSX/fujinet
          cp build/frontends/windows/fujinet-go-msx-windows.exe \
             dist/FujiNet-Go-MSX/
          cp tools/fujinet/work/out/fujinet.dll dist/FujiNet-Go-MSX/
          cp tools/fujinet/work/out/fnconfig.ini dist/FujiNet-Go-MSX/fujinet/
          cp -r tools/fujinet/work/out/data tools/fujinet/work/out/SD \
             dist/FujiNet-Go-MSX/fujinet/
          cp -r tools/openmsx/work/out/share dist/FujiNet-Go-MSX/openmsx

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/FujiNet-Go-MSX
          if-no-files-found: error

      # Ubuntu's makensis is the stock x86-unicode build with nsDialogs in
      # its default plugin directory, so the welcome and finish pages work
      # without any plugin-path juggling.
      - name: Build the installer
        run: |
          makensis -VERSION
          makensis -V2 \
            -DVERSION="${{ needs.check-version.outputs.version }}" \
            -DSRCDIR="$PWD/dist/FujiNet-Go-MSX" \
            -DOUTFILE="$PWD/dist/FujiNet-Go-MSX-Setup.exe" \
            -DAPPICON="$PWD/frontends/windows/app.ico" \
            build-aux/windows/installer.nsi
          test -f dist/FujiNet-Go-MSX-Setup.exe \
            || { echo "::error::installer not produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FujiNet-Go-MSX-Setup.exe
          if-no-files-found: error

  # One UNIVERSAL (arm64 + x86_64) bundle, built on the org's self-hosted
  # Tahoe runner (an Intel VM with no Homebrew). The arm64 slice is built and
  # checked but cannot run here; the tests exercise the x86_64 slice. Signed
  # and notarised when the credentials are configured.
  macos-package:
    needs: check-version
    runs-on: [self-hosted, macOS, X64, tahoe]
    env:
      CMAKE_OSX_ARCHITECTURES: "arm64;x86_64"
      CFLAGS: -Wno-error=unused-command-line-argument
      CXXFLAGS: -Wno-error=unused-command-line-argument
    steps:
      - uses: actions/checkout@v4

      # Same as macos.yml: build tools only, no brew-installed SDL2/Tcl/etc
      # -- openMSX supplies its own static 3rd-party chain for this target
      # (see this workflow's own header comment).
      - name: Install build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet "cmake>=3.28,<4" ninja
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Select the macOS SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Cache universal OpenSSL
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openssl-universal
          key: openssl-universal-3.5.0-${{ runner.os }}

      - name: Build universal static OpenSSL (3.5.0, pinned commit)
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          COMMIT=636dfadc70ce26f2473870570bfd9ec352806b1d # openssl-3.5.0
          SRC="$RUNNER_TEMP/openssl-src"
          rm -rf "$SRC" && git init -q "$SRC"
          git -C "$SRC" fetch -q --depth 1 https://github.com/openssl/openssl.git "$COMMIT"
          git -C "$SRC" checkout -q FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$COMMIT"
          DEST="$RUNNER_TEMP/openssl-universal"
          for arch in arm64 x86_64; do
            rm -rf "$RUNNER_TEMP/openssl-$arch"
            cp -R "$SRC" "$RUNNER_TEMP/openssl-$arch"
            (cd "$RUNNER_TEMP/openssl-$arch" &&
             ./Configure darwin64-$arch-cc no-shared no-tests \
               --prefix="$RUNNER_TEMP/openssl-$arch-inst" --libdir=lib &&
             make -j"$(sysctl -n hw.ncpu)" build_libs &&
             make install_dev)
          done
          mkdir -p "$DEST/lib"
          cp -R "$RUNNER_TEMP/openssl-x86_64-inst/include" "$DEST/include"
          for lib in libcrypto.a libssl.a; do
            lipo -create "$RUNNER_TEMP/openssl-arm64-inst/lib/$lib" \
                         "$RUNNER_TEMP/openssl-x86_64-inst/lib/$lib" \
                 -output "$DEST/lib/$lib"
          done

      - name: Point the FujiNet build at the universal OpenSSL
        run: echo "OPENSSL_ROOT_DIR=$RUNNER_TEMP/openssl-universal" >> "$GITHUB_ENV"

      # Static, so the shipped .app has no non-system library dependency.
      - name: Build and install static SDL3 (release-3.4.12, pinned)
        run: |
          rm -rf sdl3-src
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git sdl3-src
          cmake -S sdl3-src -B sdl3-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
          cmake --build sdl3-src/build
          cmake --install sdl3-src/build
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/sdl3" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Build
        run: cmake --build build

      # These seven tests start openMSX's renderer through SDL, which needs a video
      # driver; the Tahoe VMs have no window-server session ("The video driver did
      # not add any displays"). The other five run.
      - name: Test
        working-directory: build
        run: ctest --output-on-failure -E '^(debugger_test|vdp_test|boot_smoke|fujinet_smoke|machine_switch_test|rpc_test|external_smoke)$'

      # The app is built for x86_64 above and tested; this builds the arm64 half
      # (openMSX with its own static third-party chain, cross-compiled; it cannot run
      # on this Intel runner) and merges it into the same bundle. The x86_64 work
      # directories are moved aside so the arm64 build starts clean.
      - name: Add the arm64 slices
        env:
          ARM64_PRE: mv tools/openmsx/work tools/openmsx/work-x86_64; mv core/openmsx-generated/derived core/openmsx-generated/derived-x86_64
          ARM64_ENV: OPENMSX_TARGET_CPU=aarch64
          # openMSX names the CPU aarch64; the compiler wants -arch arm64
          CFLAGS: -arch arm64 -Wno-error=unused-command-line-argument
          CXXFLAGS: -arch arm64 -Wno-error=unused-command-line-argument
          LDFLAGS: -arch arm64
        run: |
          .github/workflows/macos-add-arm64.sh "frontends/macos/FujiNet Go MSX.app" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Verify the bundle is self-contained and universal
        run: |
          APP="build/frontends/macos/FujiNet Go MSX.app"
          fail=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              archs="$(lipo -archs "$f")"
              case "$archs" in
                *x86_64*arm64*|*arm64*x86_64*) ;;
                *) echo "::error::$f is not universal ($archs)"; fail=1 ;;
              esac
              if otool -L "$f" | tail -n +2 | grep -E "/opt/homebrew|/usr/local"; then
                echo "--- $f"
                otool -L "$f"
                fail=1
              fi
            fi
          done < <(find "$APP" -type f -print0)
          if [ "$fail" -ne 0 ]; then
            echo "::error::bundle is not universal or links a non-system library"
            exit 1
          fi
          test -f "$APP/Contents/Frameworks/libfujinet.dylib" \
            || { echo "::error::libfujinet.dylib missing from the bundle"; exit 1; }
          test -f "$APP/Contents/Resources/openmsx/init.tcl" \
            || { echo "::error::openMSX runtime share tree missing from the bundle"; exit 1; }

      # Signing and notarisation, when the credentials are configured (see
      # "Signing the macOS build" in the README). Without them this is a
      # no-op and the build still produces a working, unsigned bundle.
      - name: Sign and notarise the app bundle
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          APP="build/frontends/macos/FujiNet Go MSX.app"
          if [ -z "${CERT_P12}" ]; then
            echo "No signing certificate configured -- shipping unsigned."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/["[:space:]]//g')
          rm -f "$RUNNER_TEMP/cert.p12"

          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" "$APP/Contents/Frameworks/libfujinet.dylib"
          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          if [ -z "${NOTARY_KEY}" ]; then
            echo "::warning::Signed, but no notary credentials -- Gatekeeper"
            echo "::warning::will still block this build on first launch."
            exit 0
          fi

          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          rm -f "$RUNNER_TEMP/notary.p8"

      # ditto preserves the executable bits and structure that a plain
      # artifact upload of a .app directory does not.
      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent \
            "build/frontends/macos/FujiNet Go MSX.app" \
            FujiNet-Go-MSX-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-universal
          path: FujiNet-Go-MSX-macos-universal.zip
          if-no-files-found: error

  release:
    needs: [check-version, linux-packages, flatpaks, windows-package, macos-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --add-host=host.docker.internal:host-gateway
    steps:
      - name: Install base tools
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates gh zip

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # download-artifact unpacks each artifact into its own directory, so
      # the folder-shaped Windows portable build is re-zipped here, and the
      # Windows/macOS assets get the tag folded into their name to match the
      # CPack-named Linux packages sitting next to them.
      - name: Flatten artifacts into one release/ directory
        run: |
          tag="${{ needs.check-version.outputs.version }}"
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' \
                                    -o -name '*.tar.gz' -o -name '*.flatpak' \) \
            -exec cp {} release/ \;
          (cd "artifacts/windows-portable" \
           && zip -qr "$OLDPWD/release/fujinet-go-msx-${tag}-windows.zip" .)
          cp "artifacts/windows-installer/FujiNet-Go-MSX-Setup.exe" \
             "release/fujinet-go-msx-${tag}-windows-setup.exe"
          for zip in artifacts/macos-app-*/FujiNet-Go-MSX-macos-*.zip; do
            arch="${zip##*-macos-}"; arch="${arch%.zip}"
            cp "$zip" "release/fujinet-go-msx-${tag}-macos-${arch}.zip"
          done
          ls -l release

      - name: Create (or update) the draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.check-version.outputs.version }}"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${{ github.repository }}" \
              --draft --generate-notes --title "$tag"
          fi
          gh release upload "$tag" release/* --repo "${{ github.repository }}" --clobber
