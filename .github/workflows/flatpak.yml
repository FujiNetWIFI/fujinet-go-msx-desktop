name: Flatpak

# Last of the M7 CI jobs (see TODO). Builds both flatpak manifests
# (build-aux/flatpak/online.fujinet.go.msx.{gnome,kde}.yml) with
# flatpak-builder against the real GNOME/KDE runtimes pulled from Flathub.
#
# Every declared source (openMSX's seven from-source dependencies -- tcl,
# sdl2, sdl2_ttf, libogg, libvorbis, libtheora, glew -- plus mbedtls and the
# FujiNet web UI's Python deps) was downloaded and its SHA256 verified for
# real while writing these manifests, and the tcl module's full build+
# install recipe was confirmed correct end to end locally.
#
# --disable-rofiles-fuse: flatpak-builder's default build-time overlay (a
# FUSE mount layering writes over the read-only cached module install) hits
# an eu-strip "Permission denied" during its own debuginfo-extraction pass
# in a plain containerized environment -- confirmed for real on both this
# session's own dev sandbox AND a genuine GitHub Actions ubuntu-latest run
# (the first real run of this workflow, before this flag was added), so
# this is a real, repeatable containerized-CI limitation, not a one-off.
# The CoCo sibling repo's own already-working flatpak.yml carries the exact
# same flag for the exact same reason; ported directly rather than
# rediscovered independently, now that the failure is confirmed identical.
# (Both manifests also set no-debuginfo: true regardless -- a reasonable
# production choice on its own merits, avoiding the failing pass' cause
# entirely for a local flatpak-builder new enough to honor it.)
#
# No WITH_*_ROMS flag needed here either, matching linux.yml: C-BIOS is
# bundled unconditionally (see COMPLIANCE.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - build-aux/flatpak/online.fujinet.go.msx.gnome.yml
          - build-aux/flatpak/online.fujinet.go.msx.kde.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install the runtime and SDK this manifest targets
        run: |
          runtime=$(sed -n 's/^runtime: *//p' "${{ matrix.manifest }}")
          runtime_version=$(sed -n "s/^runtime-version: *'\(.*\)'/\1/p" "${{ matrix.manifest }}")
          sdk=$(sed -n 's/^sdk: *//p' "${{ matrix.manifest }}")
          flatpak install -y --user flathub \
            "${runtime}/x86_64/${runtime_version}" \
            "${sdk}/x86_64/${runtime_version}"

      # No --install: building is the check. (Installing would also work,
      # but there is nothing here to run it against on a headless runner.)
      - name: Build
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            build-flatpak "${{ matrix.manifest }}"
