# Flatpak manifest for the GNOME frontend.
#
# Self-contained: every input is declared here, so this builds from a plain
# checkout with no preparation steps -- which is also what makes it work
# unchanged in GNOME Builder (Builder finds this manifest, and its Run button
# then builds and launches the app).
#
# Unlike the sibling repos (one emulator core dependency each: SDL3, or
# nothing at all), openMSX itself needs seven from-source modules here:
# tcl, sdl2, sdl2_ttf, libogg, libvorbis, libtheora, glew. On a normal Linux
# build these come from the distribution's own packages (see
# .github/workflows/linux.yml); inside the sandbox there is no distribution
# to ask, and the GNOME runtime does not bundle any of the seven (it does
# bundle freetype2/libpng/zlib, which is why those three are NOT declared
# again here -- see cmake/OpenMSXRuntime.cmake's Linux dependency list for
# the full picture of what openMSX links). Order matters: libvorbis needs
# libogg already installed, libtheora needs both.
#
# Build + install + run:
#   flatpak-builder --user --install --force-clean build-flatpak \
#       build-aux/flatpak/online.fujinet.go.msx.gnome.yml
#   flatpak run online.fujinet.go.msx.gnome
#
# NOTE: bump runtime-version as new GNOME runtimes ship; `flatpak remote-ls
# flathub --runtime | grep org.gnome.Platform` lists what is available.
# Old runtimes go end-of-life quickly.

app-id: online.fujinet.go.msx.gnome
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: fujinet-go-msx-gnome

# Skips flatpak-builder's own debuginfo-extraction pass over every built
# module (eu-strip pulling .debug info into a separate /lib/debug tree).
# Smaller, simpler build; this app has no need to ship separate debug
# symbols in the flatpak bundle.
no-debuginfo: true

finish-args:
  - --share=ipc
  - --share=network          # FujiNet hosts + the loopback web UI
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio      # openMSX's own SDL2 Mixer audio (PipeWire's Pulse interface)
  - --device=all             # gamepad hotplug (hidraw/evdev), MSX joystick ports

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/aclocal
  - /share/man

modules:
  - name: tcl
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --enable-shared
      - --enable-threads
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl8.6.14-src.tar.gz
        sha256: 5880225babf7954c58d4fb0f5cf6279104ce1cd6aa9b71e9a6322540e1c4de66

  # post-install symlinks: SDL2's (and SDL2_ttf's) own install rule puts
  # every header under an SDL2/ subdirectory -- upstream's own deliberate,
  # long-standing convention, matched here by both the autotools and CMake
  # build systems. openMSX's own Makefile-driven build compiles
  # #include <SDL.h> / <SDL_ttf.h> with no SDL2/ prefix, relying on its own
  # pkg-config-derived -I flags to already point straight at the SDL2/
  # subdirectory -- which held for the system-installed case this project
  # is normally developed against, but not reliably for these from-source
  # modules' own generated .pc Cflags (confirmed by a real failure here:
  # TTFFont.cc's "SDL_ttf.h: No such file or directory", surfacing only as
  # a downstream link error -- "undefined reference to
  # openmsx::TTFFont::~TTFFont()" -- since openMSX's own build tolerates
  # individual compile failures). Symlinking every header flat into
  # /app/include directly works regardless of exactly which -I flags any
  # given consumer ends up with, since /app/include itself is always on
  # the search path.
  - name: sdl2
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_SHARED=ON
      - -DSDL_STATIC=OFF
      - -DSDL_TEST=OFF
      # Like glew below, this CMake build's own GNUInstallDirs logic
      # chooses "lib64" as the install subdirectory on this 64-bit build
      # host -- confirmed by a real CI failure here: sdl2.pc/SDL2_ttf.pc
      # landed at /app/lib64/pkgconfig, invisible to flatpak-builder's
      # sandbox, which only puts /app/lib/pkgconfig on PKG_CONFIG_PATH
      # (openMSX's own configure reported "SDL2_ttf: headers found, link
      # test failed" as a result). Pin it explicitly rather than relocate
      # after the fact, matching the mbedtls module's own
      # CMAKE_INSTALL_LIBDIR=lib below.
      - -DCMAKE_INSTALL_LIBDIR=lib
    post-install:
      - for f in /app/include/SDL2/*.h; do ln -sf "$f" /app/include/; done
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-2.32.6/SDL2-2.32.6.tar.gz
        sha256: 6a7a40d6c2e00016791815e1a9f4042809210bdf10cc78d2c75b45c4f52f93ad

  - name: sdl2_ttf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL2TTF_HARFBUZZ=OFF
      - -DSDL2TTF_VENDORED=OFF
      - -DBUILD_SHARED_LIBS=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
    post-install:
      - for f in /app/include/SDL2/*.h; do ln -sf "$f" /app/include/; done
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0.tar.gz
        sha256: 0b2bf1e7b6568adbdbc9bb924643f79d9dedafe061fa1ed687d1d9ac4e453bfd

  - name: libogg
    buildsystem: autotools
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/ogg/libogg-1.3.6.tar.gz
        sha256: 83e6704730683d004d20e21b8f7f55dcb3383cdf84c0daedf30bde175f774638

  - name: libvorbis
    buildsystem: autotools
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz
        sha256: 0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab

  - name: libtheora
    buildsystem: autotools
    config-opts:
      - --disable-examples
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz
        sha256: 40952956c47811928d1e7922cda3bc1f427eb75680c3c37249c91e949054916b

  # NOT "make extensions" first: that target regenerates glew.c/glew.h from
  # a live OpenGL-Registry git checkout, which needs network access the
  # sandboxed build phase does not have (confirmed by a real failure here:
  # "Error 128" cloning OpenGL-Registry). It is also unnecessary -- the
  # release tarball already ships the pre-generated headers/sources a
  # normal build needs; "extensions" is a maintainer-only regeneration
  # step, not part of the ordinary build.
  - name: glew
    buildsystem: simple
    build-commands:
      - make GLEW_DEST=/app
      - make GLEW_DEST=/app install.include install.lib
      # Two Makefile quirks, both confirmed by real failures here rather
      # than assumed: (1) no "install.pc" target -- install.lib generates
      # glew.pc as a side effect but never copies it anywhere; (2) this
      # Makefile auto-detects "lib64" as the install subdirectory on this
      # 64-bit build host, but the flatpak runtime's own pkg-config search
      # path only covers /app/lib (confirmed: every OTHER module here,
      # whose own build systems chose "lib", was found fine; only glew,
      # the one Makefile that guessed differently, was not). Relocate
      # rather than trust GLEW_DEST's own directory choice.
      #
      # A plain "mv /app/lib64/* /app/lib/" works against a local
      # flatpak-builder sandbox where /app/lib64 is a real, separate
      # directory -- but fails on a real GitHub Actions runner with "mv:
      # cannot overwrite '/app/lib/pkgconfig': Directory not empty",
      # because on that runner's copy of this runtime /app/lib64 is
      # already a symlink to /app/lib, so the glob and the destination
      # resolve to the same directory and mv refuses to move a directory
      # onto itself. realpath-comparing first makes this correct either
      # way: a real separate directory gets its contents copied over and
      # removed, a symlink-to-lib is already in the right place and there
      # is nothing to do.
      - |
        if [ "$(realpath /app/lib64)" != "$(realpath /app/lib)" ]; then
          mkdir -p /app/lib
          cp -a /app/lib64/. /app/lib/
          rm -rf /app/lib64
        fi
      # glew.pc's own template declares "Requires: glu" unconditionally;
      # openMSX calls no GLU function, and this runtime does not ship a
      # glu.pc for pkg-config to resolve it against anyway (confirmed by a
      # real failure here: "Package 'glu', required by 'glew', not
      # found"). Strip the spurious requirement rather than add a whole
      # unneeded GLU module just to satisfy it.
      - sed -i '/^Requires:/d' glew.pc
      - install -Dm644 glew.pc /app/lib/pkgconfig/glew.pc
    sources:
      - type: archive
        url: https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0.tgz
        sha256: d4fc82893cfb00109578d0a1a2337fb8ca335b3ceccf97b97e5cc7f08e4353e1

  # FujiNet links mbedTLS statically and needs 3.x (4.x drops the legacy
  # mbedtls/md5.h it includes); the runtime ships none. Threading is switched
  # on because fujinet drives TLS from several threads. Same recipe as the
  # sibling repos' manifests.
  - name: mbedtls
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_PROGRAMS=OFF
      - -DENABLE_TESTING=OFF
      - -DMBEDTLS_FATAL_WARNINGS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DUSE_STATIC_MBEDTLS_LIBRARY=ON
      - -DUSE_SHARED_MBEDTLS_LIBRARY=OFF
      - -DLINK_WITH_PTHREAD=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://github.com/Mbed-TLS/mbedtls.git
        tag: mbedtls-3.6.5
        commit: e185d7fd85499c8ce5ca2a54f5cf8fe7dbe3f8df
      - type: shell
        commands:
          - sed -i -e 's|^//#define MBEDTLS_THREADING_C|#define MBEDTLS_THREADING_C|'
            -e 's|^//#define MBEDTLS_THREADING_PTHREAD|#define MBEDTLS_THREADING_PTHREAD|'
            include/mbedtls/mbedtls_config.h

  # The FujiNet build renders its web UI from jinja2 templates driven by a
  # yaml description. Build-time only: /app/lib/python3.12/site-packages is
  # on the SDK python's path, and the module cleans up after itself.
  - name: python3-webui-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=${FLATPAK_DEST}
        --find-links="file://${PWD}" PyYAML Jinja2 MarkupSafe
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz
        sha256: d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f
      - type: file
        url: https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz
        sha256: 0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d
      - type: file
        url: https://files.pythonhosted.org/packages/7e/99/7690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7/markupsafe-3.0.3.tar.gz
        sha256: 722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698

  - name: fujinet-go-msx
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DFRONTEND=gnome
      - -DWITH_WEBVIEW=ON     # webkitgtk-6.0 ships in the GNOME runtime
    build-options:
      env:
        # Where the FujiNet build finds the static mbedTLS built above.
        MBEDTLS_ROOT_DIR: /app
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - build
          - build-flatpak
          - build-flatpak-kde
          - third_party
          - tools/openmsx/work
          - tools/fujinet/work
      # Pinned exactly as cmake/Dependencies.cmake: same commits.
      # msx_provide_dependency() skips its own clone once it finds these
      # sentinels (src/main.cc, src/main.cpp) already here.
      - type: git
        url: https://github.com/FujiNetWIFI/openMSX
        commit: b11b550120fe9d342f9bd64128de7bd06e1a7758
        dest: third_party/openmsx
      - type: git
        url: https://github.com/FujiNetWIFI/fujinet-firmware
        commit: b9a27cfa145134f5a7088535ac2721eb3cdf41be
        dest: third_party/fujinet-firmware
